<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>GTA Kamera</title>
<link href="https://fonts.googleapis.com/css2?family=Rubik+Mono+One&family=Rubik:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Pricedown (GTA yazı tipi) dosyasını fonts/pricedown.ttf olarak eklersen otomatik kullanılır.
   Yoksa Rubik Mono One yedek olarak devreye girer. */
@font-face{font-family:"Pricedown";src:url("fonts/pricedown.ttf") format("truetype");font-display:swap}

:root{--bg:#000;--fg:#fff;--gta:"Pricedown","Rubik Mono One",Impact,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:"Rubik",system-ui,sans-serif;font-weight:500}
body{min-height:100dvh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}

header{padding:12px 16px;border-bottom:3px solid var(--fg);text-align:center}
h1{margin:0;font-family:var(--gta);font-size:34px;letter-spacing:2px;
   -webkit-text-stroke:2px #000;paint-order:stroke fill;text-shadow:3px 3px 0 #555}

main{max-width:560px;margin:0 auto;padding:12px}
[hidden]{display:none!important}

.viewfinder{position:relative;aspect-ratio:3/4;border:3px solid var(--fg);background:#111;overflow:hidden}
video{width:100%;height:100%;object-fit:cover}
#camMsg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;font-family:var(--gta);font-size:18px}

.bar{display:flex;align-items:center;justify-content:space-between;padding:18px 4px}
#shutter{width:78px;height:78px;border-radius:50%;background:#000;border:4px solid var(--fg);
  box-shadow:inset 0 0 0 6px #000,inset 0 0 0 30px var(--fg);cursor:pointer}
#shutter:active{transform:scale(.92)}

.btn{display:inline-flex;align-items:center;justify-content:center;background:#000;color:var(--fg);border:2px solid var(--fg);
  font-family:var(--gta);font-size:16px;letter-spacing:1px;padding:12px 14px;min-height:46px;cursor:pointer;flex:1}
.btn.sm{flex:0 0 auto;min-width:84px;font-size:14px;padding:10px}
.btn.solid{background:var(--fg);color:#000}
.btn:active{background:var(--fg);color:#000}
.btn.solid:active{background:#000;color:var(--fg)}

.canvasWrap{border:3px solid var(--fg);background:#111;line-height:0}
canvas{width:100%;height:auto;touch-action:none;cursor:move}

.panel{padding:14px 0}
.lbl{display:block;font-family:var(--gta);font-size:14px;letter-spacing:1px;margin:12px 0 6px}
textarea{width:100%;background:#000;color:var(--fg);border:2px solid var(--fg);padding:10px;font:inherit;font-size:18px;resize:none;border-radius:0;text-transform:uppercase}
.row{display:flex;gap:8px;margin:10px 0;flex-wrap:wrap}
.row .btn.sm{flex:1}

.slider{display:flex;align-items:center;gap:10px;margin:8px 0}
.slider span{width:96px;font-family:var(--gta);font-size:13px}
input[type=range]{flex:1;-webkit-appearance:none;appearance:none;height:6px;background:#444;outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;background:var(--fg);border:3px solid #000;outline:2px solid var(--fg)}
input[type=range]::-moz-range-thumb{width:22px;height:22px;background:var(--fg);border:3px solid #000;border-radius:0}

#status{min-height:22px;margin-top:6px;font-size:14px;text-align:center}

</style>
</head>
<body>
<header><h1>KAMERA</h1></header>

<main>
  <!-- KAMERA EKRANI -->
  <section id="camScreen">
    <div class="viewfinder">
      <video id="video" autoplay playsinline muted></video>
      <div id="camMsg"></div>
    </div>
    <div class="bar">
      <button id="flipBtn" class="btn sm">ÇEVİR</button>
      <button id="shutter" aria-label="Fotoğraf çek"></button>
      <label class="btn sm">GALERİ<input type="file" id="fileIn" accept="image/*" hidden></label>
    </div>
  </section>

  <!-- DÜZENLEME EKRANI -->
  <section id="editScreen" hidden>
    <div class="canvasWrap"><canvas id="canvas"></canvas></div>

    <div class="panel">
      <label class="lbl">YAZI</label>
      <textarea id="txt" rows="2" maxlength="80" placeholder="Yazını buraya yaz">GRAND THEFT</textarea>

      <label class="lbl">KONUM (yazıyı sürükleyebilirsin)</label>
      <div class="row">
        <button class="btn sm" data-pos="top">ÜST</button>
        <button class="btn sm" data-pos="mid">ORTA</button>
        <button class="btn sm" data-pos="bot">ALT</button>
        <button class="btn sm" id="colorBtn">RENK: BEYAZ</button>
      </div>

      <div class="slider"><span>YATAY</span><input type="range" id="x" min="0" max="100" value="50"></div>
      <div class="slider"><span>DİKEY</span><input type="range" id="y" min="0" max="100" value="12"></div>
      <div class="slider"><span>BOYUT</span><input type="range" id="size" min="4" max="30" value="12"></div>
      <div class="slider"><span>KONTUR</span><input type="range" id="stroke" min="0" max="30" value="12"></div>
      <div class="slider"><span>KONTRAST</span><input type="range" id="contrast" min="-100" max="100" value="0"></div>
      <div class="slider"><span>PARLAKLIK</span><input type="range" id="bright" min="-100" max="100" value="0"></div>
      <div class="slider"><span>SİYAH-BEYAZ</span><input type="range" id="gray" min="0" max="100" value="0"></div>

      <div class="row">
        <button class="btn" id="retake">YENİDEN ÇEK</button>
        <button class="btn solid" id="save">KAYDET</button>
      </div>
      <div class="row">
        <button class="btn" id="share">PAYLAŞ</button>
      </div>
      <div id="status"></div>
    </div>
  </section>
</main>

<script>
const MAX_W = 1280;
const FONT = '"Pricedown","Rubik Mono One",Impact,sans-serif';

const $ = id => document.getElementById(id);
const video = $('video'), camScreen = $('camScreen'), editScreen = $('editScreen');
const cv = $('canvas'), ctx = cv.getContext('2d');
let stream = null, facing = 'environment', base = null, procData = null, white = true, dragging = false;
const st = { x: .5, y: .12, size: 12, stroke: 12, contrast: 0, bright: 0, gray: 0 };

/* ---------- KAMERA ---------- */
async function startCam() {
  stopCam();
  $('camMsg').textContent = '';
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: facing, width: { ideal: 1280 }, height: { ideal: 1280 } }, audio: false });
    video.srcObject = stream;
  } catch (e) {
    $('camMsg').textContent = 'KAMERA AÇILAMADI. İZİN VER VEYA GALERİDEN FOTOĞRAF SEÇ.';
  }
}
function stopCam() { if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; } }

$('flipBtn').onclick = () => { facing = facing === 'environment' ? 'user' : 'environment'; startCam(); };
$('shutter').onclick = () => {
  if (!video.videoWidth) return;
  loadSource(video, video.videoWidth, video.videoHeight, facing === 'user');
};
$('fileIn').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const img = new Image();
  img.onload = () => { loadSource(img, img.naturalWidth, img.naturalHeight, false); URL.revokeObjectURL(img.src); };
  img.src = URL.createObjectURL(f);
  e.target.value = '';
};

function loadSource(src, w, h, mirror) {
  const s = Math.min(1, MAX_W / Math.max(w, h));
  base = document.createElement('canvas');
  base.width = Math.round(w * s); base.height = Math.round(h * s);
  const b = base.getContext('2d');
  if (mirror) { b.translate(base.width, 0); b.scale(-1, 1); }
  b.drawImage(src, 0, 0, base.width, base.height);
  cv.width = base.width; cv.height = base.height;
  stopCam();
  camScreen.hidden = true; editScreen.hidden = false;
  processImage();
}
$('retake').onclick = () => { editScreen.hidden = true; camScreen.hidden = false; startCam(); };

/* ---------- GÖRÜNTÜ AYARLARI (kontrast / parlaklık / siyah-beyaz) ---------- */
function processImage() {
  const d = base.getContext('2d').getImageData(0, 0, base.width, base.height);
  const p = d.data, c = st.contrast * 2.55, br = st.bright * 2.55, g = st.gray / 100;
  const f = (259 * (c + 255)) / (255 * (259 - c));
  for (let i = 0; i < p.length; i += 4) {
    let r = p[i], gg = p[i + 1], b = p[i + 2];
    if (g) { const l = .299 * r + .587 * gg + .114 * b; r += (l - r) * g; gg += (l - gg) * g; b += (l - b) * g; }
    p[i]     = f * (r - 128) + 128 + br;
    p[i + 1] = f * (gg - 128) + 128 + br;
    p[i + 2] = f * (b - 128) + 128 + br;
  }
  procData = d;
  render();
}

/* ---------- YAZI (GTA tarzı) ---------- */
function render() {
  if (!procData) return;
  ctx.putImageData(procData, 0, 0);
  const lines = $('txt').value.toUpperCase().split('\n').filter(l => l.trim());
  if (!lines.length) return;
  const px = st.size / 100 * cv.width, lh = px * 1.05;
  ctx.font = px + 'px ' + FONT;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round'; ctx.miterLimit = 2;
  ctx.lineWidth = px * st.stroke / 100 * 2;
  const fill = white ? '#fff' : '#000', line = white ? '#000' : '#fff';
  const y0 = st.y * cv.height - (lines.length - 1) * lh / 2;
  lines.forEach((t, i) => {
    const x = st.x * cv.width, y = y0 + i * lh;
    if (st.stroke > 0) {
      ctx.save();
      ctx.shadowColor = 'rgba(0,0,0,.6)'; ctx.shadowBlur = px * .12; ctx.shadowOffsetY = px * .07;
      ctx.strokeStyle = line; ctx.strokeText(t, x, y);
      ctx.restore();
    }
    ctx.fillStyle = fill; ctx.fillText(t, x, y);
  });
}

/* ---------- KONTROLLER ---------- */
$('txt').oninput = render;
$('colorBtn').onclick = e => { white = !white; e.target.textContent = 'RENK: ' + (white ? 'BEYAZ' : 'SİYAH'); render(); };
document.querySelectorAll('[data-pos]').forEach(b => b.onclick = () => {
  st.x = .5; st.y = { top: .12, mid: .5, bot: .88 }[b.dataset.pos];
  syncPos(); render();
});
function syncPos() { $('x').value = st.x * 100; $('y').value = st.y * 100; }
$('x').oninput = e => { st.x = e.target.value / 100; render(); };
$('y').oninput = e => { st.y = e.target.value / 100; render(); };
$('size').oninput = e => { st.size = +e.target.value; render(); };
$('stroke').oninput = e => { st.stroke = +e.target.value; render(); };
['contrast', 'bright', 'gray'].forEach(k => $(k).oninput = e => { st[k] = +e.target.value; processImage(); });

// Yazıyı parmakla sürükle
function moveTo(e) {
  const r = cv.getBoundingClientRect();
  st.x = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
  st.y = Math.min(1, Math.max(0, (e.clientY - r.top) / r.height));
  syncPos(); render();
}
cv.addEventListener('pointerdown', e => { dragging = true; cv.setPointerCapture(e.pointerId); moveTo(e); });
cv.addEventListener('pointermove', e => { if (dragging) moveTo(e); });
cv.addEventListener('pointerup', () => dragging = false);
cv.addEventListener('pointercancel', () => dragging = false);

/* ---------- KAYDET / PAYLAŞ / YÜKLE ---------- */
const say = m => $('status').textContent = m;
const blobOf = () => new Promise(r => cv.toBlob(r, 'image/jpeg', .92));

$('save').onclick = async () => {
  const blob = await blobOf();
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'gta_' + Date.now() + '.jpg';
  document.body.appendChild(a); a.click(); a.remove();
  say('KAYDEDİLDİ (indirilenler). WebView indirmeyi engellerse PAYLAŞ kullan.');
};
$('share').onclick = async () => {
  const blob = await blobOf();
  const file = new File([blob], 'gta.jpg', { type: 'image/jpeg' });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file] }); } catch (e) {}
  } else say('Bu cihaz paylaşımı desteklemiyor.');
};

/* ---------- BAŞLAT ---------- */
Promise.all([document.fonts.load('40px "Pricedown"'), document.fonts.load('40px "Rubik Mono One"')])
  .catch(() => {}).finally(() => { render(); });
startCam();

</script>
</body>
</html>
